<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" width="800" height="80" role="img" aria-label="Zeolite, 1.1.0, Closed Testing">
<title>Zeolite, 1.1.0, Closed Testing</title>
<style>
.d1{animation:d1 18s ease-in-out infinite}.d2{animation:d2 22s ease-in-out infinite}.d3{animation:d3 16s ease-in-out infinite}
@keyframes d1{50%{transform:translate(120px,0)}}
@keyframes d2{50%{transform:translate(-120px,0)}}
@keyframes d3{50%{transform:translate(0,24px)}}
@media (prefers-reduced-motion:reduce){.d1,.d2,.d3{animation:none}}
</style>
<defs>
<clipPath id="c"><rect width="800" height="80" rx="14"/></clipPath>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="42"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
<linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.28"/></linearGradient>
<linearGradient id="gs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="1"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.5"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/></linearGradient>
</defs>
<g clip-path="url(#c)">
<rect width="800" height="80" fill="#eef3f9"/>
<g filter="url(#blur)">
<circle class="d1" cx="160" cy="32" r="48" fill="#8fd0ff" opacity="1"/>
<circle class="d2" cx="600" cy="48" r="44" fill="#7fe0d6" opacity="1"/>
<circle class="d3" cx="400" cy="8" r="32" fill="#c3b4ff" opacity="0.9"/>
</g>
<rect x="12" y="12" width="776" height="56" rx="20" fill="url(#gf)" stroke="url(#gs)" stroke-width="1.2"/><rect x="11.5" y="11.5" width="777" height="57" rx="20.5" fill="none" stroke="#0f1e3c" stroke-opacity="0.1"/><ellipse cx="283.6" cy="18" rx="217.28" ry="5" fill="#ffffff" opacity="0.8" filter="url(#soft)"/><text x="40" y="49" fill="#0d1117" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="24" font-weight="700">Zeolite</text><rect x="577" y="27" width="187" height="26" rx="13" fill="#ffffff" fill-opacity="0.6" stroke="#0f1e3c" stroke-opacity="0.15"/>
<text x="670.5" y="44.5" text-anchor="middle" fill="#0b6fa4" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12">1.1.0 · Closed Testing</text>
</g>
</svg>
