<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 44" width="600" height="44" role="img" aria-label="Flutter, Dart, Riverpod, SQLite — apps that work with no signal">
  <style>
    .l {
      font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
      font-size: 21px;
      font-weight: 600;
      fill: #13B9FD;
      opacity: 0;
      animation: hold 20s infinite;
    }
    .l1 { animation-delay: 0s; }
    .l2 { animation-delay: 5s; }
    .l3 { animation-delay: 10s; }
    .l4 { animation-delay: 15s; }

    /* Visible for its own quarter of the loop, typed in over the first 1.6s. */
    @keyframes hold {
      0%    { opacity: 1; clip-path: inset(0 100% 0 0); }
      8%    { opacity: 1; clip-path: inset(0 0 0 0); }
      23%   { opacity: 1; clip-path: inset(0 0 0 0); }
      25%   { opacity: 0; clip-path: inset(0 0 0 0); }
      100%  { opacity: 0; clip-path: inset(0 0 0 0); }
    }

  </style>

  <text class="l l1" x="300" y="28" text-anchor="middle">Flutter · Dart · Riverpod · SQLite</text>
  <text class="l l2" x="300" y="28" text-anchor="middle">Apps that work with no signal</text>
  <text class="l l3" x="300" y="28" text-anchor="middle">Domain logic that never imports Flutter</text>
  <text class="l l4" x="300" y="28" text-anchor="middle">80 tests and no device required</text>
</svg>
